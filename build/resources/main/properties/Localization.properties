campaign_preview_check=Add campaign preview?
campaign_preview_check_tooltip=Changes each map's preview to the campaign preview, hiding the minimap. (Recommended)
next_level_name_check=Show next level name?
next_level_name_check_tooltip=Shows the name of the next level upon victory. Especially useful for campaigns with branching paths. (Recommended)
legacy_assets_check=Add legacy assets?
legacy_assets_check_tooltip=Adds Reign of Chaos models and icons that were removed in Reforged. (Recommended, requires "legacy.zip" for SD or "legacyHD.zip" for HD)
remove_upkeep_check=Remove Upkeep?
remove_upkeep_check_tooltip=Removes Upkeep from each map. May lead to unforeseen consequences. (Not recommended)
archon_mode_dropdown=Archon Mode slots
archon_mode_dropdown_tooltip=Select the number of player slots, limited by the amount of unused slots of every map.
to_download_folder_check=Extract to Download folder?
to_download_folder_check_tooltip=Extracts the maps to the Warcraft III Download folder. (Check if you play Archon Mode and are not the host)
