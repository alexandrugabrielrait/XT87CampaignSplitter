help_text_splitter=Нажмите на "%s" для выбора файла Кампании Warcraft III ("*.w3n").\n\
Нажмите на "%s" для разделения кампании (файл кампании не будет изменён).\n\
Будет создана папка с таким же именем, как у кампании, в том же месте.\n\
Эта папка будет содержать все извлечённые карты, объединённые с данными из кампании.
help_text_archon_mode=Для Архонт-режима, все игроки при разделении должны выбрать одинаковые опции, а также использовать одинаковые версии программы и кампаний!\n\
Хост должен отключить опцию "%s".\n\
Все остальные игроки должны включить опцию "%s".
