help_text_splitter=Haz clic en "%s" para seleccionar un archivo de campaña personalizada de Warcraft III ("*.w3n").\n\
Haz clic en "%s" para dividir la campaña (el archivo original de la campaña no se modificará).\n\
Se creará una carpeta con el mismo nombre que la campaña en la misma ubicación.\n\
Esta carpeta contendrá todos los mapas extraídos, combinados con los datos de la campaña.
help_text_archon_mode=Para el modo Archon, todos los jugadores deben seleccionar las mismas opciones y usar la misma versión de la herramienta y de la campaña.\n\
El anfitrión de la sala de espera debe desmarcar la opción "%s".\n\
Todos los demás jugadores deben marcar la opción "%s".