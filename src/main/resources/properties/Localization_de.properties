help_text_splitter=Klicken Sie auf "%s", um eine benutzerdefinierte Warcraft-III-Kampagnendatei ("*.w3n") auszuwählen.\n\
Klicken Sie auf "%s", um die Kampagne zu teilen (die Kampagnendatei wird nicht geändert).\n\
Es wird ein Ordner mit demselben Namen wie die Kampagne im selben Verzeichnis erstellt.\n\
Dieser Ordner enthält alle extrahierten Karten, die mit den Kampagnendaten kombiniert sind.
help_text_archon_mode=Für den Archon-Modus müssen alle Spieler dieselben Optionen auswählen, dieselbe Version des Tools und der Kampagne verwenden!\n\
Der Lobby-Host muss die Option "%s" deaktivieren.\n\
Alle anderen Spieler müssen die Option "%s" aktivieren.
