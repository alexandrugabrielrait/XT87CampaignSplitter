help_text_splitter=Click "%s" to select a Warcraft III Custom Campaign file ("*.w3n").\n\
Click "%s" to split the campaign (the campaign file will not be altered).\n\
A folder with the same name as the campaign will be created in the same location.\n\
This folder will contain all extracted maps, merged with campaign data.
help_text_archon_mode=For Archon Mode, all players need to select the exact same options, use the same version of the tool and of the campaign!\n\
The lobby host needs to have the "%s" option unchecked.\n\
All other players need to have the "%s" option checked.