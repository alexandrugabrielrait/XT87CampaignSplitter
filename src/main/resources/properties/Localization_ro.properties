help_text_splitter=Faceți clic pe "%s" pentru a selecta un fișier de Campanie Warcraft III ("*.w3n").\n\
Faceți clic pe "%s" pentru a separa campania (fișierul campaniei nu va fi modificat).\n\
Un folder cu același nume ca și campania va fi creat în aceeași locație.\n\
Acest folder va conține toate hărțile extrase, împreună cu datele campaniei.
help_text_archon_mode=Pentru Modul Archon, toți jucătorii trebuie să selecteze aceleași opțiuni, să folosească aceeași versiune a acestui program și a campaniei!\n\
Gazda lobby-ului trebuie să nu aibă opțiunea "%s" bifată.\n\
Toți ceilalți jucători trebuie să aibă opțiunea "%s" bifată.
