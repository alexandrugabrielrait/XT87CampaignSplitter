help_text_splitter=單擊“%s”以選擇Warcraft III活動文件（“*.w3n”）。\n\
單擊“%s”以分割活動（不會修改活動文件）。將在相同位置創建與活動同名的文件夾。\n\
此文件夾將包含所有提取的地圖，並與活動數據合併。
help_text_archon_mode=對於Archon模式，所有玩家都需要選擇相同的選項，使用相同版本的工具和活動！\n\
