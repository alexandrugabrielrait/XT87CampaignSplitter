campaign_preview_check=添加活動預覽？
campaign_preview_check_tooltip=將每張地圖的預覽更改為活動預覽，隱藏小地圖。（建議）
next_level_name_check=顯示下一級別名稱？
next_level_name_check_tooltip=在勝利後顯示下一級別的名稱。對於具有分支路徑的活動特別有用。（建議）
legacy_assets_sd_check=添加SD舊資產？
legacy_assets_sd_check_tooltip=添加在Reforged中刪除的Reign of Chaos模型和圖示。（在經典圖形地圖上遊玩時建議）
legacy_assets_hd_check=添加HD舊資產？
legacy_assets_hd_check_tooltip=添加Reign of Chaos模型和圖示的高清版本，在Reforged圖形地圖上遊玩時建議。
remove_upkeep_check=移除維持？
remove_upkeep_check_tooltip=從每張地圖中移除維持。可能導致意想不到的後果。（不建議）
archon_mode_dropdown=Archon模式插槽
archon_mode_dropdown_tooltip=選擇玩家插槽的數量，受每張地圖未使用插槽數量的限制。
