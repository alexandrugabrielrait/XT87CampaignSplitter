help_text_splitter=单击“%s”以选择Warcraft III自定义战役文件（“*.w3n”）。\n\
单击“%s”以分割战役（战役文件不会被修改）。\n\
将创建一个与战役同名的文件夹在相同位置。\n\
此文件夹将包含所有提取的地图，与战役数据合并。
help_text_archon_mode=对于Archon模式，所有玩家在分割时都必须选择相同的选项，并使用相同版本的工具和战役！\n\
大堂主机必须取消选择“%s”选项。\n\
所有其他玩家都必须选择“%s”选项。
